[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed"
version = "0.1.0"
description = "Activation-monitor penalties and CoT-labelled replay for coding policies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch==2.6.0", "vllm==0.8.5.post1", "transformers==4.57.6", "peft==0.20.0", "datasets>=3,<4",
  "numpy", "scikit-learn", "pandas", "pyarrow", "scipy", "matplotlib", "PyYAML", "huggingface_hub", "accelerate", "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
